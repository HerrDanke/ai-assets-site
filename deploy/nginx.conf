server {
    listen 8083;
    server_name _;

    root /root/webhost/ai-assets-site/dist;
    index index.html;

    # 启用 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # 静态资源缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # 静态内容源命名空间：缺失即 404
    # /raw/ 下只有 .md 静态文件、无页面路由；若落进 SPA fallback 会以 200 返回
    # index.html，前端 fetch 的 r.ok 判断随之失效（缺文件被当作正文打进下载包）
    location /raw/ {
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
